name: Build Android APK

on:
  push:
    branches: [ main, master, dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle Packages & Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-artifacts/Voxis_v1.7.1.apk
          APK_SIZE=$(du -h build-artifacts/Voxis_v1.7.1.apk | cut -f1)

          echo "### 🚀 Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`Voxis_v1.7.1.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | v1.7.1 (Major: 1, Iteration: 7, Bugfix: 1) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Size** | \`$APK_SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Architecture** | arm64-v8a / universal debug |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ **How to download:** Scroll down to the **Artifacts** section at the bottom of this page and click on **\`Voxis_v1.7.1\`**, or download directly under **Releases**." >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Voxis_v1.7.1
          path: build-artifacts/Voxis_v1.7.1.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases (Tags or Main)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.7.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Voxis v1.7.1 Release' }}
          files: build-artifacts/Voxis_v1.7.1.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

